version: '3.8'
services:
  mysql_db:
    image: mysql:8.0
    container_name: mi_mysql_container
    restart: always
    environment:
      MYSQL_DATABASE: airTortilla
      MYSQL_USER: erik
      MYSQL_PASSWORD: patata
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
